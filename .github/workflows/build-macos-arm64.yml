name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA_PATH: .ci-derived
  SWIFTPM_CACHE_PATH: .ci-swiftpm
  OUTPUT_DIR: build-output
  WHISPER_CPP_REF: master

jobs:
  build:
    name: Build local app
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -1d /Applications/Xcode*.app || true

          selected=""
          for version in 26.3 26.2 26.1.1 26.0.1 26.1 26.0; do
            candidate="/Applications/Xcode_${version}.app"
            if [ -d "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "::error::Xcode 26 is required because one or more Swift packages require Swift tools 6.2+."
            exit 1
          fi

          sudo xcode-select -s "$selected/Contents/Developer"
          echo "Selected Xcode: $selected"
          xcodebuild -version
          swift --version

      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          cmake --version
          df -h

      - name: Prepare build directories
        run: |
          mkdir -p "$HOME/Downloads"
          mkdir -p "$HOME/VoiceInk-Dependencies"
          mkdir -p "$SWIFTPM_CACHE_PATH" "$OUTPUT_DIR"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SWIFTPM_CACHE_PATH }}
          key: voiceink-swiftpm-xcode26-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            voiceink-swiftpm-xcode26-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: voiceink-whisper-macos-arm64-xcode26-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_CPP_REF }}-${{ hashFiles('.github/scripts/build-whisper-macos-arm64.sh') }}
          restore-keys: |
            voiceink-whisper-macos-arm64-xcode26-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_CPP_REF }}-

      - name: Build macOS arm64 whisper.xcframework
        run: bash .github/scripts/build-whisper-macos-arm64.sh

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -clonedSourcePackagesDirPath "$PWD/$SWIFTPM_CACHE_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee resolve-packages.log

      - name: Build VoiceInk for local use
        run: |
          set -o pipefail
          rm -rf "$DERIVED_DATA_PATH" "$OUTPUT_DIR/VoiceInk.app"

          xcodebuild -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Debug \
            -derivedDataPath "$PWD/$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$PWD/$SWIFTPM_CACHE_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            build \
            2>&1 | tee build.log

          APP_PATH="$PWD/$DERIVED_DATA_PATH/Build/Products/Debug/VoiceInk.app"
          test -d "$APP_PATH"
          ditto "$APP_PATH" "$OUTPUT_DIR/VoiceInk.app"
          xattr -cr "$OUTPUT_DIR/VoiceInk.app"

      - name: Locate built app
        run: |
          echo "Apps under output directory:"
          find "$OUTPUT_DIR" -maxdepth 2 -name '*.app' -print || true
          echo "Apps under derived data:"
          find "$DERIVED_DATA_PATH" -maxdepth 6 -name '*.app' -print || true

      - name: Verify Apple Silicon app
        run: |
          APP="$OUTPUT_DIR/VoiceInk.app"
          EXECUTABLE="$APP/Contents/MacOS/VoiceInk"

          test -d "$APP"
          test -x "$EXECUTABLE"

          file "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Architectures: $ARCHS"

          if [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::Expected an arm64 Apple Silicon build, got: $ARCHS"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP" || \
            echo "::warning::codesign verification failed. This is an ad-hoc local build, not a notarized release build."

      - name: Package app
        run: |
          APP="$OUTPUT_DIR/VoiceInk.app"
          ZIP="VoiceInk-${GITHUB_SHA::7}-macos-arm64.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-macos-arm64-${{ github.sha }}
          path: |
            VoiceInk-*-macos-arm64.zip
            VoiceInk-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-build-logs-${{ github.sha }}
          path: |
            build.log
            resolve-packages.log
          if-no-files-found: ignore
          retention-days: 7
